name: Android Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor
        type: choice
        required: false
        default: release
        options: [release, debug]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.name }}
      apk-path: ${{ steps.apk-path.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Disable Google Analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get
        timeout-minutes: 5

      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
        timeout-minutes: 5

      - name: Run tests
        run: flutter test --no-pub
        timeout-minutes: 10

      - name: Decode Android keystore (if secret present)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/ai_calendar_release.keystore"
          echo "keystore-path=$HOME/.android/ai_calendar_release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore-path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_PATH}" ] && [ -f "${KEYSTORE_PATH}" ]; then
            echo "=== Building signed release APK ==="
            flutter build apk --release --no-pub \
              --dart-define=APP_VERSION=${{ steps.version.outputs.name }} \
              --build-name="${{ steps.version.outputs.name }}"
          else
            echo "=== No signing secrets found, building unsigned release APK ==="
            flutter build apk --release --no-pub \
              --no-shrink \
              --dart-define=APP_VERSION=${{ steps.version.outputs.name }} \
              --build-name="${{ steps.version.outputs.name }}"
          fi
        timeout-minutes: 45

      - name: Rename APK with version
        id: apk-path
        run: |
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          DST_DIR="build/app/outputs/flutter-apk"
          DST="${DST_DIR}/ai-calendar-${{ steps.version.outputs.name }}.apk"
          if [ -f "$SRC" ]; then
            mv "$SRC" "$DST"
            echo "path=${DST}" >> "$GITHUB_OUTPUT"
            echo "APK size: $(du -h "$DST" | cut -f1)"
          else
            echo "app-release.apk not found at $SRC" >&2
            ls -la build/app/outputs/flutter-apk/ 2>&1 || true
            exit 1
          fi

      - name: Build Android App Bundle (AAB) [optional]
        if: steps.keystore.outputs.keystore-path != ''
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore-path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --no-pub \
            --build-name="${{ steps.version.outputs.name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-calendar-release-apk
          path: ${{ steps.apk-path.outputs.path }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload AAB artifact (if built)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ai-calendar-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: ignore

  draft-release:
    name: Create GitHub Release Draft
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-calendar-release-apk

      - name: Generate release notes
        id: release-notes
        run: |
          {
            echo "body<<RELEASE_EOF"
            echo "## AI Calendar ${{ needs.build-release.outputs.version }}"
            echo ""
            if command -v git >/dev/null 2>&1 && git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
              echo "### Changes since $(git describe --tags --abbrev=0 HEAD^)"
              echo ""
              git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --oneline --no-merges | head -50 | sed 's/^/- /' || true
            else
              echo "Initial release."
            fi
            echo ""
            echo "### File hashes"
            echo ""
            APK_FILE=$(find . -maxdepth 2 -name 'ai-calendar-*.apk' | head -n1)
            if [ -n "$APK_FILE" ]; then
              echo "| File | SHA256 |"
              echo "|------|--------|"
              HASH=$(sha256sum "$APK_FILE" | awk '{print $1}')
              echo "| \`$(basename "$APK_FILE")\` | \`$HASH\` |"
            fi
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Calendar ${{ github.ref_name }}
          body: ${{ steps.release-notes.outputs.body }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ai-calendar-*.apk
