name: Flutter CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "metadata/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "web/**"
      - "windows/**"
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "metadata/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "web/**"
      - "windows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-analyze-test:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: Disable Google Analytics
        run: flutter config --no-analytics

      - name: Print Flutter version
        run: flutter --version --machine

      - name: Install dependencies
        run: flutter pub get
        timeout-minutes: 5

      - name: Verify formatting (dart format)
        run: |
          dart format --set-exit-if-changed \
            lib \
            test
        timeout-minutes: 3

      - name: Static analysis (flutter analyze)
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
        timeout-minutes: 5

      - name: Run widget & unit tests
        run: flutter test --no-pub --coverage --test-randomize-ordering-seed random
        timeout-minutes: 10

      - name: Upload coverage to Codecov (optional)
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: coverage/lcov.info
          flags: flutter,unit
          name: ai-calendar-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  android-build-check:
    name: Android · Build Debug APK
    needs: format-analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Disable Google Analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get
        timeout-minutes: 5

      - name: Build Android Debug APK
        run: flutter build apk --debug --no-pub
        timeout-minutes: 35

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-calendar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
